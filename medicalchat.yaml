# Medical Chat — Medical Park Hastaneler Grubu
version: 1.3.0
cache: true

interface:
  customWelcome: "Medical Chat'e hoş geldiniz."
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

# Web araması — anahtarsız yığın. Keenable'ın herkese açık uçları hız sınırlı;
# anahtar yalnızca bu sınırı yükseltir, çalışması için gerekli değil.
# Reranker'ların hepsi anahtar istediği için 'none' seçildi.
webSearch:
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: none
  keenableSearchOptions:
    maxResults: 5
    attributionTitle: Medical Chat
    timeout: 15000
  keenableScraperOptions:
    attributionTitle: Medical Chat
    timeout: 15000
