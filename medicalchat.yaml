# Medical Chat — Medical Park Hastaneler Grubu
version: 1.3.16
cache: true

interface:
  customWelcome: "Medical Chat'e hoş geldiniz."
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

# Web araması — anahtarsız yığın. Keenable'ın herkese açık uçları hız sınırlı;
# anahtar yalnızca bu sınırı yükseltir, çalışması için gerekli değil.
# Reranker'ların hepsi anahtar istediği için 'none' seçildi.
webSearch:
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: none
  keenableSearchOptions:
    maxResults: 5
    attributionTitle: Medical Chat
    timeout: 15000
  keenableScraperOptions:
    attributionTitle: Medical Chat
    timeout: 15000

# Langfuse izleme — kullanım metriklerinin kime ait olduğunu görebilmek için
# kullanıcıyı e-posta ile etiketler ve model/endpoint bilgisini iz üstüne yazar.
# Varsayılan iz yalnızca dahili kullanıcı kimliğini taşır, bu alanlar açıkça
# listelenmedikçe dışa aktarılmaz.
langfuse:
  trace:
    userIdField: email
    userMetadataFields: [email, username, role]
    conversationMetadataFields: [conversationId, endpoint, model, modelLabel, spec]

# Ek model sağlayıcıları. İkisi de OpenAI uyumlu API sunduğu için varsayılan
# istemci kullanılıyor. `fetch: true` model listesini sağlayıcıdan canlı çeker;
# anahtar tanımlı değilse `default` listesine düşer.
endpoints:
  custom:
    - name: 'DeepSeek'
      apiKey: '${DEEPSEEK_API_KEY}'
      baseURL: 'https://api.deepseek.com/v1'
      models:
        default:
          - 'deepseek-chat'
          - 'deepseek-reasoner'
        fetch: true
      titleConvo: true
      titleModel: 'deepseek-chat'
      modelDisplayLabel: 'DeepSeek'

    - name: 'Kimi'
      apiKey: '${MOONSHOT_API_KEY}'
      baseURL: 'https://api.moonshot.ai/v1'
      models:
        default:
          - 'kimi-k2-0905-preview'
          - 'kimi-k2-turbo-preview'
        fetch: true
      titleConvo: true
      titleModel: 'kimi-k2-turbo-preview'
      modelDisplayLabel: 'Kimi'
