# Medical Chat — Medical Park Hastaneler Grubu
version: 1.3.16
cache: true

interface:
  customWelcome: "MLP/AI'a hoş geldiniz, {{user.name}}."
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

# Web araması — anahtarsız yığın. Keenable'ın herkese açık uçları hız sınırlı;
# anahtar yalnızca bu sınırı yükseltir, çalışması için gerekli değil.
# Reranker'ların hepsi anahtar istediği için 'none' seçildi.
webSearch:
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: none
  keenableSearchOptions:
    maxResults: 5
    attributionTitle: Medical Chat
    timeout: 15000
  keenableScraperOptions:
    attributionTitle: Medical Chat
    timeout: 15000

# Langfuse izleme — kullanım metriklerinin kime ait olduğunu görebilmek için
# kullanıcıyı e-posta ile etiketler ve model/endpoint bilgisini iz üstüne yazar.
# Varsayılan iz yalnızca dahili kullanıcı kimliğini taşır, bu alanlar açıkça
# listelenmedikçe dışa aktarılmaz.
langfuse:
  trace:
    userIdField: email
    userMetadataFields: [email, username, role]
    conversationMetadataFields: [conversationId, endpoint, model, modelLabel, spec]

# Ek model sağlayıcıları. İkisi de OpenAI uyumlu API sunduğu için varsayılan
# istemci kullanılıyor. `fetch: true` model listesini sağlayıcıdan canlı çeker;
# anahtar tanımlı değilse `default` listesine düşer.
endpoints:
  custom:
    - name: 'DeepSeek'
      apiKey: '${DEEPSEEK_API_KEY}'
      baseURL: 'https://api.deepseek.com/v1'
      models:
        default:
          - 'deepseek-chat'
          - 'deepseek-reasoner'
        fetch: true
      titleConvo: true
      titleModel: 'deepseek-chat'
      modelDisplayLabel: 'DeepSeek'

    - name: 'Kimi'
      apiKey: '${MOONSHOT_API_KEY}'
      baseURL: 'https://api.moonshot.ai/v1'
      models:
        default:
          - 'kimi-k2-0905-preview'
          - 'kimi-k2-turbo-preview'
        fetch: true
      titleConvo: true
      titleModel: 'kimi-k2-turbo-preview'
      modelDisplayLabel: 'Kimi'

# Massive.com piyasa verisi — kurumun API anahtarıyla, uygulama konteynerinin
# içinde stdio olarak çalışır; ayrı bir servis gerektirmez. Barındırılan
# mcp.massive.com yalnızca OAuth JWT kabul ettiği için anahtarlı yol budur.
# Konteynerde git olmadığı için kaynak git deposu değil sürüm arşivi.
# v0.10.0 mcp'yi üst sınırsız istiyor; mcp 2.x FastMCP'yi kaldırdığı için 1.x'e sabitlendi.
# İlk bağlantıda bağımlılıklar indirildiğinden başlatma süresi uzun tutuldu.
mcpServers:
  # PubMed / Europe PMC literatür araması. npm paketi, konteyner içinde stdio.
  # Sorgular doğrudan NCBI'ya gider; aracı bir servis yok.
  # NCBI anahtarı isteğe bağlı: yoksa 3 istek/sn, varsa 10 istek/sn.
  pubmed:
    type: stdio
    title: 'PubMed literatür'
    description: 'PubMed ve Europe PMC üzerinde makale arama, tam metin ve atıf bilgisi'
    command: npx
    args:
      - '-y'
      - '@cyanheads/pubmed-mcp-server@2.10.18'
    env:
      MCP_TRANSPORT_TYPE: 'stdio'
    initTimeout: 180000
    timeout: 120000

  massive:
    type: stdio
    title: 'ABD Borsa - API anahtarı'
    description: 'Massive.com piyasa verisi — kurumun API anahtarıyla'
    command: uvx
    args:
      - '--with'
      - 'mcp>=1.27,<2'
      - '--from'
      - 'mcp_massive @ https://github.com/massive-com/mcp_massive/archive/refs/tags/v0.10.0.tar.gz'
      - 'mcp_massive'
    env:
      MASSIVE_API_KEY: '${MASSIVE_API_KEY}'
    initTimeout: 180000
    timeout: 120000

# Hafıza — test aşaması: validKeys ile anahtar kısıtı koymadık, model her şeyi
# saklayabilir. Otomatik çıkarım için şema sabit bir model istiyor (sohbetin
# kendi modelini kullanan bir mod yok); bu model yalnızca hafıza çıkarımında
# kullanılır, sohbetlerin modelini etkilemez.
memory:
  disabled: false
  personalize: true
  tokenLimit: 10000
  messageWindowSize: 5
  agent:
    enabled: true
    provider: 'openAI'
    model: 'gpt-4.1-mini'
    instructions: 'Kullanıcı hakkında sonraki sohbetlerde işe yarayacak kalıcı bilgileri sakla: tercihleri, sorumlu olduğu işler, çalıştığı sistemler, süregelen konular. Tek seferlik soruları ve geçici ayrıntıları saklama. Kullanıcının dilinde yaz.'
    model_parameters:
      temperature: 0.1
